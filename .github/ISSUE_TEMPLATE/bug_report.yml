name: Bug Report
description: Report a bug or unexpected behavior.
title: "[BUG] - "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the details below to help us investigate.
  - type: dropdown
    id: library
    attributes:
      label: Affected Library
      description: Which library does the issue relate to?
      options:
        - React Library
        - Stencil Library
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: Provide a clear and concise description of the problem.
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduce
      description: Provide the steps to reproduce the issue.
      placeholder: "1. Go to...\n2. Click on...\n3. Observe the issue."
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Console Output
      description: Paste any relevant logs or console output.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct Agreement
      description: By submitting this issue, you agree to follow our Code of Conduct.
      options:
        - label: I agree to follow the Code of Conduct
          required: true
