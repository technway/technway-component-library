name: Feature Request
description: Suggest a new feature or enhancement.
title: "[FEATURE] - "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide the following details:
  - type: dropdown
    id: library
    attributes:
      label: Library
      description: Which library does this feature relate to?
      options:
        - Stencil Library
        - React Library
    validations:
      required: true
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Description
      description: What feature would you like to see?
      placeholder: Describe the feature you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: How would this feature improve your workflow?
      placeholder: Describe the use case for this feature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Are there any alternatives you've considered?
      placeholder: Describe any alternative solutions or features you've considered.
