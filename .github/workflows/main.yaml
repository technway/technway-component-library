name: CI/CD

env:
  ACTIONS_STEP_DEBUG: true

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write

jobs:
    lint:
        name: Lint Code
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Node.js with cache
              uses: actions/setup-node@v3
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install Dependencies for @technway/components
              working-directory: packages/stencil-library
              run: npm install

            - name: Run Lint
              run: npx lerna run lint

    test:
        name: Run Spec Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Node.js with cache
              uses: actions/setup-node@v3
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install Dependencies for @technway/components
              working-directory: packages/stencil-library
              run: npm install

            - name: Run Tests
              run: npx lerna run test.spec

    chromatic:
        name: Run Chromatic Visual Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: 20

            - name: Install Dependencies for @technway/components
              working-directory: packages/stencil-library
              run: npm ci

            - name: Build Project
              working-directory: packages/stencil-library
              run: npm run build:stencil

            - name: Run Chromatic
              env:
                  CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
              run: |
                  cd packages/stencil-library && npx chromatic --project-token $CHROMATIC_PROJECT_TOKEN --exit-zero-on-changes

    # deploy-storybook:
    #     name: Deploy Storybook to Vercel
    #     runs-on: ubuntu-latest
    #     needs: # This ensures deploy-storybook runs only if lint, test and chromatic succeeds
    #         - bootstrap
    #         # - lint
    #         # - test
    #         # - chromatic
    #     steps:
    #         - name: Checkout repository
    #           uses: actions/checkout@v3

    #         - name: Set up Node.js with cache
    #           uses: actions/setup-node@v3
    #           with:
    #               node-version: 20
    #               cache: "npm"

    #         - name: Install Dependencies for @technway/components
    #           working-directory: packages/stencil-library
    #           run: npm install

    #         - name: Build Stencil components
    #           run: npx lerna run build:stencil

    #         - name: Generate and update docs
