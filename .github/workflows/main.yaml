  versioning:
    name: Versioning Packages
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      # - chromatic
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Release Please
        uses: google-github-actions/release-please-action@v3
        with:
          release-type: node
          monorepo-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Authenticate with npm registry
      - name: Authenticate with npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      # Log git status
      - name: Check Git Status
        run: git status

      # Bump versions without creating Git tags
      - name: Version packages
        run: npx lerna version --conventional-commits --yes --no-git-tag-version --no-push --loglevel verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Log git status
      - name: Check Git Status
        run: git status

      # Build Stencil Library
      - name: Build Stencil Library
        run: |
          npm run build:stencil

      # Build React Library
      - name: Build React Library
        run: |
          npm run build:react

      # Build Next Library
      - name: Build Next Library
        run: |
          npm run build:next

      # Commit the changes made by `lerna version`
      - name: Commit version changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: version bump and changelog updates [skip ci]"
          git push origin HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish packages without versioning
      - name: Publish packages
        run: npx lerna publish from-package --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
