    versioning:
        name: Versioning Packages
        runs-on: ubuntu-latest
        needs:
            - lint
            - test
            - chromatic
        steps:
          - name: Checkout
            uses: actions/checkout@v3
    
          - name: Release Please
            uses: google-github-actions/release-please-action@v3
            with:
              release-type: node
              monorepo-tags: true
              token: ${{ secrets.GITHUB_TOKEN }}

